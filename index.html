            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Stranger Things style glitch/flicker */
        @keyframes flicker {
            0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% { opacity: 1; }
            20%, 21.999%, 63%, 63.999%, 65%, 69.999% { opacity: 0.4; }
        }
        .flicker {
            animation: flicker 4s infinite linear;
        }
